---
# TP6: Valeurs pour l'environnement prod
# Écrase les valeurs par défaut dans values.yaml

# ============================================
# Configuration globale
# ============================================
nameOverride: "nova-hello-prod"
fullnameOverride: "nova-hello-prod"

# ============================================
# Configuration de l'application
# ============================================
app:
  version: "1.0.0"
  
  image:
    repository: nginx
    tag: "1.25"
    pullPolicy: IfNotPresent
  
  # Ressources (plus élevées en prod)
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ============================================
# Configuration du déploiement
# ============================================
deployment:
  replicaCount: 3
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  
  # Timeout plus long en prod
  progressDeadlineSeconds: 1200

# ============================================
# Configuration du Service
# ============================================
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# ============================================
# Configuration Ingress
# ============================================
ingress:
  enabled: true
  
  className: "nginx"
  
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # Configuration pour Let's Encrypt (à activer si utilisé)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: http-01
  
  hosts:
    - host: prod.novalab.local
      paths:
        - path: /
          pathType: Prefix
          serviceName: nova-hello-prod
          servicePort: 80
    - host: nova-hello.example.com
      paths:
        - path: /
          pathType: Prefix
          serviceName: nova-hello-prod
          servicePort: 80
  
  tls:
    enabled: true
    secretName: prod-tls
    hosts:
      - prod.novalab.local
      - nova-hello.example.com

# ============================================
# Configuration NetworkPolicy
# ============================================
networkPolicy:
  enabled: true
  
  # Politique stricte en production
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nova-hello-prod
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
  
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443  # HTTPS uniquement
        - protocol: TCP
          port: 53   # DNS
        - protocol: UDP
          port: 53   # DNS

# ============================================
# Configuration Auto-scaling
# ============================================
autoscaling:
  enabled: true
  
  minReplicas: 3
  maxReplicas: 10
  
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max

# ============================================
# Configuration PodDisruptionBudget
# ============================================
podDisruptionBudget:
  enabled: true
  
  maxUnavailable: 1

# ============================================
# Configuration ConfigMap
# ============================================
configmap:
  enabled: true
  
  data:
    NODE_ENV: "production"
    LOG_LEVEL: "info"
    APP_NAME: "nova-hello"
    ENVIRONMENT: "prod"

# ============================================
# Configuration Secret
# ============================================
secret:
  enabled: true
  
  name: nova-hello-prod-secret
  
  type: Opaque
  
  # Exemple de données (à remplir avec helm-secrets ou Ansible Vault)
  # data:
  #   DB_PASSWORD: "{{ .Values.externalSecrets.dbPassword | b64enc }}"

# ============================================
# Configuration des sondes
# ============================================
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 1
    successThreshold: 1
    
  startup:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

# ============================================
# Configuration des labels
# ============================================
labels:
  app: nova-hello
  tier: backend
  managed_by: helm
  environment: prod
  version: "1.0.0"

# ============================================
# Configuration des annotations
# ============================================
annotations:
  description: "Application nova-hello en environnement prod"
  prometheus.io/scrape: "true"
  prometheus.io/port: "80"

# ============================================
# Configuration Pod
# ============================================
pod:
  labels:
    environment: prod
    version: "1.0.0"
  
  # Security context plus strict en prod
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  
  # NodeSelector pour cibler la VM prod
  nodeSelector:
    kubernetes.io/hostname: prod.novalab.local

# ============================================
# Configuration du namespace
# ============================================
namespace:
  create: true
  name: nova-hello-prod

# ============================================
# Configuration des tests
# ============================================
tests:
  enabled: true
  
  testConnection:
    enabled: true
    path: /
    port: 80
    expectedStatus: 200
    expectedContent: "Hello"
