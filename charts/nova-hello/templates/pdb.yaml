{{- if .Values.podDisruptionBudget.enabled -}}
---
# TP6: PodDisruptionBudget pour l'application nova-hello
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nova-hello.fullname" . }}
  labels:
    {{- include "nova-hello.labels" . | nindent 4 }}
spec:
  {{- if kindIs "int" .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable | quote }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nova-hello.selectorLabels" . | nindent 6 }}
{{- end -}}
