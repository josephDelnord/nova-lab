{{- if .Values.namespace.create -}}
---
# TP6: Namespace pour l'application nova-hello
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name | default "default" }}
  labels:
    {{- include "nova-hello.labels" . | nindent 4 }}
    name: {{ .Values.namespace.name | default "default" | quote }}
{{- end -}}
