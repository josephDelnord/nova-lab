{{- if .Values.secret.enabled -}}
---
# TP6: Secret pour l'application nova-hello
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nova-hello.secret.name" . | default (include "nova-hello.fullname" .) }}
  labels:
    {{- include "nova-hello.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: {{ .Values.secret.type | default "Opaque" }}
data:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ tpl $value $ | b64enc | quote }}
  {{- end }}
{{- end -}}
