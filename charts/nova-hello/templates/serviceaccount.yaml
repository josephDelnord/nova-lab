---
# TP6: ServiceAccount pour l'application nova-hello
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nova-hello.serviceAccountName" . }}
  labels:
    {{- include "nova-hello.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
