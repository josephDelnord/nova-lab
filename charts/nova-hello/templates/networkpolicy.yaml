{{- if .Values.networkPolicy.enabled -}}
---
# TP6: NetworkPolicy pour l'application nova-hello
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nova-hello.fullname" . }}
  labels:
    {{- include "nova-hello.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nova-hello.selectorLabels" . | nindent 6 }}
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  policyTypes:
    - Ingress
    - Egress
{{- end -}}
