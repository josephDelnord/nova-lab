---
# TP6: Valeurs pour l'environnement preprod
# Écrase les valeurs par défaut dans values.yaml

# ============================================
# Configuration globale
# ============================================
nameOverride: "nova-hello-preprod"
fullnameOverride: "nova-hello-preprod"

# ============================================
# Configuration de l'application
# ============================================
app:
  version: "1.0.0-dev"
  
  image:
    repository: nginx
    tag: "1.25"
    pullPolicy: IfNotPresent
  
  # Ressources (plus légères en preprod)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ============================================
# Configuration du déploiement
# ============================================
deployment:
  replicaCount: 2
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# ============================================
# Configuration du Service
# ============================================
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# ============================================
# Configuration Ingress
# ============================================
ingress:
  enabled: true
  
  className: "nginx"
  
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  
  hosts:
    - host: preprod.novalab.local
      paths:
        - path: /
          pathType: Prefix
          serviceName: nova-hello-preprod
          servicePort: 80
  
  tls:
    enabled: false

# ============================================
# Configuration NetworkPolicy
# ============================================
networkPolicy:
  enabled: true
  
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nova-hello-preprod
        - ipBlock:
            cidr: 192.168.56.0/24
      ports:
        - protocol: TCP
          port: 80

# ============================================
# Configuration Auto-scaling
# ============================================
autoscaling:
  enabled: false

# ============================================
# Configuration des sondes
# ============================================
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5

# ============================================
# Configuration ConfigMap
# ============================================
configmap:
  enabled: true
  
  data:
    NODE_ENV: "development"
    LOG_LEVEL: "debug"
    APP_NAME: "nova-hello"
    ENVIRONMENT: "preprod"

# ============================================
# Configuration des labels
# ============================================
labels:
  app: nova-hello
  tier: backend
  managed_by: helm
  environment: preprod

# ============================================
# Configuration des annotations
# ============================================
annotations:
  description: "Application nova-hello en environnement preprod"

# ============================================
# Configuration Pod
# ============================================
pod:
  labels:
    environment: preprod
  
  # NodeSelector pour cibler la VM preprod
  nodeSelector:
    kubernetes.io/hostname: preprod.novalab.local

# ============================================
# Configuration du namespace
# ============================================
namespace:
  create: true
  name: nova-hello-preprod
