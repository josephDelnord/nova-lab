---
- name: Installer git (requis par 'helm plugin install')
  ansible.builtin.apt:
    lock_timeout: 120
    name: git
    state: present

- name: Installer les dépendances Python du module kubernetes.core.helm
  ansible.builtin.pip:
    name:
      - kubernetes
      - PyYAML
    state: present

- name: Installer le binaire Helm {{ helm_version }}
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1", "--wildcards", "*/helm"]
    creates: /usr/local/bin/helm

- name: Installer le plugin helm-diff (version compatible Helm {{ helm_version }})
  ansible.builtin.command:
    cmd: helm plugin install https://github.com/databus23/helm-diff --version 3.9.14
  args:
    creates: /root/.local/share/helm/plugins/helm-diff/plugin.yaml
