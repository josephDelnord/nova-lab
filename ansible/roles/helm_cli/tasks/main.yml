---
# TP5: Tâches principales pour helm_cli

- name: Display Helm installation header
  debug:
    msg: "⚓ Installation de Helm CLI sur {{ inventory_hostname }}"

- name: Check if Helm is already installed
  command: helm version
  register: helm_installed
  ignore_errors: yes
  changed_when: false

- name: Download Helm install script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3.sh
    mode: 0755
  when: helm_installed.rc != 0

- name: Install Helm
  command: /tmp/get-helm-3.sh
  when: helm_installed.rc != 0

- name: Verify Helm installation
  command: helm version
  register: helm_version
  changed_when: false

- name: Show Helm version
  debug:
    var: helm_version.stdout_lines

- name: Add Bitnami repository
  command: helm repo add bitnami https://charts.bitnami.com/bitnami
  when: helm_repositories is defined and 'bitnami' in helm_repositories

- name: Add custom repositories
  command: helm repo add {{ item.name }} {{ item.url }}
  loop: "{{ helm_repositories | default([]) }}"
  when: helm_repositories is defined

- name: Update Helm repositories
  command: helm repo update
