---
# TP12: Role compliance - Audit de conformité avec Goss
# Ce role vérifie que les nœuds sont conformes aux politiques de sécurité

# Import des variables par défaut
defaults:
  from: defaults/main.yml

# Import des variables
vars:
  from: vars/main.yml

# Dépendances
dependencies:
  - role: common

tags:
  - compliance
  - audit
  - goss

tasks:
  - import_tasks: tasks/install.yml
  - import_tasks: tasks/run.yml
  - import_tasks: tasks/report.yml

handlers:
  - import_tasks: handlers/main.yml
