---
# TP3: Variables pour le role common

# ============================================
# Variables système
# ============================================

system_packages:
  - curl
  - wget
  - git
  - unzip
  - htop
  - net-tools
  - iotop
  - iftop
  - vim
  - nano
  - tmux
  - tree
  - jq
  - yq
  - make
  - build-essential
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release

# ============================================
# Variables utilisateur
# ============================================

admin_user: vagrant
admin_group: vagrant
admin_shell: /bin/bash
admin_home: /home/{{ admin_user }}

# ============================================
# Variables SSH
# ============================================

ssh:
  port: 22

# ============================================
# Variables NTP
# ============================================

ntp:
  enabled: true

# ============================================
# Variables sécurité
# ============================================

security:
  ufw:
    enabled: true
    default_policy: DENY
  
  fail2ban:
    enabled: true
    bantime: 3600
    findtime: 600
    maxretry: 5

# ============================================
# Variables réseau
# ============================================

resolv_conf:
  nameservers:
    - "8.8.8.8"
    - "8.8.4.4"
  search_domains:
    - "novalab.local"
    - "local"

# ============================================
# Variables locale
# ============================================

locale: "en_US.UTF-8"
timezone: "Europe/Paris"

# ============================================
# Variables logging
# ============================================

logging:
  logrotate:
    enabled: true
