---
# TP3: Role common - Configuration commune à tous les nœuds
# Ce role applique les configurations de base nécessaires sur tous les serveurs

# ============================================
# Variables par défaut
# ============================================

# Import des variables par défaut
defaults:
  from: defaults/main.yml

# Import des variables
vars:
  from: vars/main.yml

# ============================================
# Dépendances (rôles requiso)
# ============================================
dependencies: []

# ============================================
# Tags pour filtrer l'exécution
# ============================================
tags:
  - common
  - baseline
  - system

# ============================================
# Tâches à exécuter
# ============================================
tasks:
  - import_tasks: tasks/main.yml

# ============================================
# Handlers
# ============================================
handlers:
  - import_tasks: handlers/main.yml
