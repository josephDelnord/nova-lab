---
- name: Créer le répertoire des charts sur le nœud
  ansible.builtin.file:
    path: /opt/nova/charts
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Publier le chart sur le nœud (artefact versionné)
  ansible.builtin.copy:
    src: "{{ nova_chart_src }}/"          # le "/" final copie le CONTENU du dossier
    dest: "{{ nova_chart_dest }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Déployer ou mettre à jour la release Helm
  kubernetes.core.helm:
    name: "{{ nova_release_name }}"
    chart_ref: "{{ nova_chart_dest }}"
    release_namespace: "{{ nova_namespace }}"
    create_namespace: true
    kubeconfig: "{{ nova_kubeconfig }}"
    wait: true                            # attend que les pods soient prêts
    wait_timeout: 3m
    atomic: true                          # annule seul en cas d'échec
    values: "{{ lookup('ansible.builtin.template', 'values.yaml.j2') | from_yaml }}"   # <-- LE POINT DE JONCTION : inventaire -> valeurs Helm
  register: nova_helm_result
  no_log: "{{ not (nova_show_diff | default(false) | bool) }}"   # masque le secret ET le diff ; -e nova_show_diff=true pour relire un diff en --check

- name: Afficher la révision déployée
  ansible.builtin.debug:
    msg: "{{ nova_release_name }} en révision {{ nova_helm_result.status.revision | default('(simulation --check : rien déployé)') }} sur {{ env_name }}"
  when: nova_helm_result.status is defined
