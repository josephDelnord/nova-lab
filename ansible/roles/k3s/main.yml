---
# TP5: Role k3s - Installation et configuration de Kubernetes (k3s)
# Ce role installe k3s (Lightweight Kubernetes) sur les nœuds

# ============================================
# Variables par défaut
# ============================================

# Import des variables par défaut
defaults:
  from: defaults/main.yml

# Import des variables
vars:
  from: vars/main.yml

# ============================================
# Dépendances (rôles requis)
# ============================================
dependencies:
  - role: common

# ============================================
# Tags pour filtrer l'exécution
# ============================================
tags:
  - k3s
  - kubernetes
  - cluster

# ============================================
# Tâches à exécuter
# ============================================

# Tâches de pré-installation
pre_tasks:
  - import_tasks: tasks/pre-install.yml

# Tâches principales
tasks:
  - import_tasks: tasks/install.yml

# Tâches post-installation
post_tasks:
  - import_tasks: tasks/post-install.yml

# ============================================
# Handlers
# ============================================
handlers:
  - import_tasks: handlers/main.yml
