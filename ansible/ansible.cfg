[defaults]
inventory              = /vagrant/ansible/inventories/hosts.yml
roles_path             = /vagrant/ansible/roles
remote_user            = vagrant
private_key_file       = /home/vagrant/.ssh/id_ed25519
host_key_checking      = False        ; laboratoire uniquement (en production : known_hosts géré)
retry_files_enabled    = False
interpreter_python     = auto_silent
callback_result_format = yaml         ; sorties lisibles
nocows                 = True
; Une identité Ansible Vault par environnement (activée au TP4)
; Les mots de passe vivent dans /home/vagrant (HORS du montage /vagrant : sur ce
; partage tous les fichiers paraissent exécutables, d'où l'erreur "Exec format error")
vault_identity_list  = preprod@/home/vagrant/.vault_pass_preprod, prod@/home/vagrant/.vault_pass_prod

[ssh_connection]
pipelining = True                     ; moins d'allers-retours SSH, exécution plus rapide
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
