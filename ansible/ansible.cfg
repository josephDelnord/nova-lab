[defaults]
# TP1: Configuration Ansible pour nova-lab

# Répertoire de l'inventaire
inventory = inventories/hosts.yml

# Utilisateur par défaut
remote_user = vagrant

# Fichier de clé SSH privée
private_key_file = ~/.ssh/id_rsa

# Désactiver la vérification des clés SSH (pour les labs)
host_key_checking = False

# Interpréteur Python à utiliser
interpreter_python = /usr/bin/python3

# Désactiver la mise en cache des faits
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts

# Retries pour les connexions SSH
retries_files_enabled = False

# Afficher plus de détails sur les changements
diff = True

# Gestion des erreurs
any_errors_fatal = True

# Timeout pour les connexions
timeout = 30

# Supprimer les fichiers temporaires
keep_remote_files = False

# Mode verbeux par défaut
# verbosity = 1


[privilege_escalation]
# Méthode d'escalade de privilèges
become_method = sudo

# Utilisateur pour l'escalade
become_user = root

# Ne pas demander de mot de passe
become_ask_pass = False

# Désactiver la vérification du mot de passe sudo
become_ask_pass = False


[inventory]
# Activer l'inventory plugin
enable_plugins = host_list, script, yaml, ini, auto


[ssh_connection]
# Configuration de la connexion SSH
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=60 -o ConnectionAttempts=3


[paramiko_connection]
# Désactiver le partage de connexion
record_host_keys = False
