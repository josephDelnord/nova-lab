---
# TP9-TP10: Playbook de déploiement de l'application via Helm
# Ce playbook utilise Ansible pour piloter Helm et déployer l'application

- name: Deploy application using Helm
  hosts: ctrl
  become: yes
  gather_facts: yes
  
  vars_files:
    - "../inventories/group_vars/all/main.yml"

  tasks:
    # ============================================
    # TP9: Préparation du déploiement
    # ============================================
    
    - name: Ensure Helm is installed
      command: helm version
      register: helm_version
      changed_when: false
      failed_when: helm_version.rc != 0

    - name: Ensure kubectl is configured
      command: kubectl cluster-info
      register: cluster_info
      changed_when: false
      failed_when: cluster_info.rc != 0

    - name: Ensure chart directory exists
      file:
        path: "{{ playbook_dir }}/../../charts/nova-hello"
        state: directory

    # ============================================
    # TP9: Vérification des namespaces
    # ============================================
    
    - name: Check if preprod namespace exists
      command: kubectl get namespace nova-hello-preprod
      register: preprod_ns
      ignore_errors: yes
      changed_when: false

    - name: Create preprod namespace
      command: kubectl create namespace nova-hello-preprod
      when: preprod_ns.rc != 0

    - name: Check if prod namespace exists
      command: kubectl get namespace nova-hello-prod
      register: prod_ns
      ignore_errors: yes
      changed_when: false

    - name: Create prod namespace
      command: kubectl create namespace nova-hello-prod
      when: prod_ns.rc != 0

    # ============================================
    # TP9: Déploiement avec Helm (méthode Ansible)
    # ============================================
    
    - name: Deploy to preprod using Helm
      block:
        - name: Show preprod deployment status
          debug:
            msg: "Déploiement de l'application en environnement preprod..."

        - name: Helm upgrade preprod
          command: >
            helm upgrade --install nova-hello ../../charts/nova-hello \
              -n nova-hello-preprod \
              -f ../../charts/nova-hello/values-preprod.yaml \
              --atomic \
              --wait \
              --timeout 10m
          register: helm_preprod
          changed_when: helm_preprod.rc == 0

        - name: Show preprod deployment result
          debug:
            var: helm_preprod

      tags:
        - preprod
        - deploy

    - name: Deploy to prod using Helm
      block:
        - name: Show prod deployment status
          debug:
            msg: "Déploiement de l'application en environnement prod..."

        - name: Helm upgrade prod
          command: >
            helm upgrade --install nova-hello ../../charts/nova-hello \
              -n nova-hello-prod \
              -f ../../charts/nova-hello/values-prod.yaml \
              --atomic \
              --wait \
              --timeout 10m
          register: helm_prod
          changed_when: helm_prod.rc == 0

        - name: Show prod deployment result
          debug:
            var: helm_prod

      tags:
        - prod
        - deploy

    # ============================================
    # TP10: Ansible pilote Helm (méthode alternative)
    # ============================================
    
    - name: Deploy using Ansible Helm module (preprod)
      kubernetes.core.helm:
        name: nova-hello
        chart_ref: ../../charts/nova-hello
        namespace: nova-hello-preprod
        values_files:
          - ../../charts/nova-hello/values-preprod.yaml
        atomic: yes
        wait: yes
        timeout: 600
      when: false  # Désactivé car nécessite la collection kubernetes.core
      tags:
        - preprod
        - ansible-helm

    - name: Deploy using Ansible Helm module (prod)
      kubernetes.core.helm:
        name: nova-hello
        chart_ref: ../../charts/nova-hello
        namespace: nova-hello-prod
        values_files:
          - ../../charts/nova-hello/values-prod.yaml
        atomic: yes
        wait: yes
        timeout: 600
      when: false  # Désactivé car nécessite la collection kubernetes.core
      tags:
        - prod
        - ansible-helm

    # ============================================
    # TP10: Rollback
    # ============================================
    
    - name: Rollback preprod deployment
      command: >
        helm rollback nova-hello 1 \
          -n nova-hello-preprod \
          --wait \
          --timeout 5m
      when: false  # Désactivé par défaut, activer avec --tags rollback
      tags:
        - preprod
        - rollback

    - name: Rollback prod deployment
      command: >
        helm rollback nova-hello 1 \
          -n nova-hello-prod \
          --wait \
          --timeout 5m
      when: false  # Désactivé par défaut
      tags:
        - prod
        - rollback

    # ============================================
    # TP10: Vérification du déploiement
    # ============================================
    
    - name: Verify preprod deployment
      block:
        - name: Check pods status in preprod
          command: kubectl get pods -n nova-hello-preprod
          register: preprod_pods
          changed_when: false

        - name: Show preprod pods status
          debug:
            var: preprod_pods.stdout_lines

        - name: Check services in preprod
          command: kubectl get svc -n nova-hello-preprod
          register: preprod_svc
          changed_when: false

        - name: Show preprod services
          debug:
            var: preprod_svc.stdout_lines

      tags:
        - preprod
        - verify

    - name: Verify prod deployment
      block:
        - name: Check pods status in prod
          command: kubectl get pods -n nova-hello-prod
          register: prod_pods
          changed_when: false

        - name: Show prod pods status
          debug:
            var: prod_pods.stdout_lines

        - name: Check services in prod
          command: kubectl get svc -n nova-hello-prod
          register: prod_svc
          changed_when: false

        - name: Show prod services
          debug:
            var: prod_svc.stdout_lines

      tags:
        - prod
        - verify

    # ============================================
    # TP10: Suppression du déploiement
    # ============================================
    
    - name: Uninstall preprod deployment
      command: helm uninstall nova-hello -n nova-hello-preprod
      when: false  # Désactivé par défaut
      tags:
        - preprod
        - uninstall

    - name: Uninstall prod deployment
      command: helm uninstall nova-hello -n nova-hello-prod
      when: false  # Désactivé par défaut
      tags:
        - prod
        - uninstall

    # ============================================
    # TP10: Liste des releases
    # ============================================
    
    - name: List all Helm releases
      command: helm list --all-namespaces
      register: helm_releases
      changed_when: false
      tags:
        - list

    - name: Show Helm releases
      debug:
        var: helm_releases.stdout_lines
      tags:
        - list
