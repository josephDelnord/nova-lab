---
# TP14: Variables secrètes pour l'environnement prod
# Ce fichier doit être chiffré avec Ansible Vault
# Commande pour chiffrer: ansible-vault encrypt vault.yml
# Commande pour éditer: ansible-vault edit vault.yml

# ============================================
# ⚠️ ATTENTION ⚠️
# Ce fichier contient des secrets de PRODUCTION.
# Il doit être traité avec le plus grand soin.
# ============================================

# ============================================
# Secrets de base de données (Production)
# ============================================
database:
  host: "prod-db.novalab.local"
  port: 5432
  name: "nova_hello_prod"
  user: "nova_user_prod"
  password: "{{ vault_db_password_prod }}"  # Chiffré avec Ansible Vault
  
  # Pour MySQL/MariaDB
  mysql:
    root_password: "{{ vault_mysql_root_password_prod }}"
  
  # Pour PostgreSQL
  postgres:
    admin_password: "{{ vault_postgres_admin_password_prod }}"
    superuser_password: "{{ vault_postgres_superuser_password_prod }}"

# ============================================
# Secrets Kubernetes (Production)
# ============================================
kubernetes:
  # Token pour le dashboard Kubernetes
  dashboard_token: "{{ vault_k8s_dashboard_token_prod }}"
  
  # Token pour le service account (avec permissions limitées)
  service_account_token: "{{ vault_k8s_sa_token_prod }}"
  
  # Clé privée pour le certificat Kubernetes
  ca_private_key: "{{ vault_k8s_ca_private_key_prod }}"
  
  # Certificat API server
  api_server_cert: "{{ vault_k8s_api_server_cert_prod }}"
  api_server_key: "{{ vault_k8s_api_server_key_prod }}"

# ============================================
# Secrets Helm (Production)
# ============================================
helm:
  # Token pour les repositories privés
  repo_token: "{{ vault_helm_repo_token_prod }}"

# ============================================
# Secrets pour l'application (Production)
# ============================================
app:
  # Clé secrète pour l'application
  secret_key: "{{ vault_app_secret_key_prod }}"
  
  # Token JWT (plus long en prod)
  jwt_secret: "{{ vault_app_jwt_secret_prod }}"
  jwt_expiration: 3600  # 1 heure
  
  # Clé API pour les services externes
  api_key: "{{ vault_app_api_key_prod }}"
  api_secret: "{{ vault_app_api_secret_prod }}"
  
  # Token pour les webhooks
  webhook_token: "{{ vault_app_webhook_token_prod }}"
  
  # Clé de chiffrement pour les données sensibles
  encryption_key: "{{ vault_app_encryption_key_prod }}"
  
  # Mot de passe pour la base de données de l'application
  db_password: "{{ vault_app_db_password_prod }}"

# ============================================
# Secrets Docker Registry (Production)
# ============================================
docker:
  registry:
    url: "registry.example.com"
    username: "{{ vault_docker_username_prod }}"
    password: "{{ vault_docker_password_prod }}"
    email: "admin@example.com"
    
  # Token pour Docker Hub
  hub:
    token: "{{ vault_docker_hub_token_prod }}"

# ============================================
# Secrets pour les services externes (Production)
# ============================================
external_services:
  # AWS
  aws:
    access_key: "{{ vault_aws_access_key_prod }}"
    secret_key: "{{ vault_aws_secret_key_prod }}"
    session_token: "{{ vault_aws_session_token_prod }}"
    region: "eu-west-1"
    
    # Clé KMS pour le chiffrement
    kms:
      key_id: "{{ vault_aws_kms_key_id_prod }}"
    
    # Secrets S3
    s3:
      bucket: "nova-hello-prod-backups"
      access_key: "{{ vault_aws_s3_access_key_prod }}"
      secret_key: "{{ vault_aws_s3_secret_key_prod }}"
  
  # Azure
  azure:
    client_id: "{{ vault_azure_client_id_prod }}"
    client_secret: "{{ vault_azure_client_secret_prod }}"
    tenant_id: "{{ vault_azure_tenant_id_prod }}"
    subscription_id: "{{ vault_azure_subscription_id_prod }}"
  
  # GitHub
  github:
    token: "{{ vault_github_token_prod }}"
    webhook_secret: "{{ vault_github_webhook_secret_prod }}"
    
  # GitLab
  gitlab:
    token: "{{ vault_gitlab_token_prod }}"
    webhook_secret: "{{ vault_gitlab_webhook_secret_prod }}"
    
  # CI/CD
  ci_cd:
    jenkins_token: "{{ vault_jenkins_token_prod }}"
    github_actions_token: "{{ vault_github_actions_token_prod }}"
    
  # Monitoring
  monitoring:
    datadog:
      api_key: "{{ vault_datadog_api_key_prod }}"
      app_key: "{{ vault_datadog_app_key_prod }}"
    
    newrelic:
      license_key: "{{ vault_newrelic_license_key_prod }}"

# ============================================
# Secrets de monitoring (Production)
# ============================================
monitoring:
  prometheus:
    basic_auth:
      username: "{{ vault_prometheus_username_prod }}"
      password: "{{ vault_prometheus_password_prod }}"
    
    # Clé pour Alertmanager
    alertmanager:
      slack_webhook: "{{ vault_prometheus_alertmanager_slack_webhook_prod }}"
      pagerduty_key: "{{ vault_prometheus_alertmanager_pagerduty_key_prod }}"
    
    # Configuration du storage
    storage:
      s3:
        access_key: "{{ vault_prometheus_s3_access_key_prod }}"
        secret_key: "{{ vault_prometheus_s3_secret_key_prod }}"
  
  grafana:
    admin:
      username: admin
      password: "{{ vault_grafana_admin_password_prod }}"
      email: "admin@example.com"
    
    # Clé API Grafana
    api_key: "{{ vault_grafana_api_key_prod }}"
    
    # Data sources
    datasources:
      prometheus:
        url: "http://prometheus-server:9090"
        access: proxy
        basic_auth: true
        basic_auth_user: "{{ vault_prometheus_username_prod }}"
        basic_auth_password: "{{ vault_prometheus_password_prod }}"

# ============================================
# Certificats et clés (Production)
# ============================================
certificates:
  # Clé privée SSL (à ne JAMAIS stocker en clair)
  ssl:
    private_key: "{{ vault_ssl_private_key_prod }}"
    certificate: "{{ vault_ssl_certificate_prod }}"
    chain: "{{ vault_ssl_certificate_chain_prod }}"
    fullchain: "{{ vault_ssl_fullchain_prod }}"
    
    # Configuration Let's Encrypt
    letsencrypt:
      account_key: "{{ vault_letsencrypt_account_key_prod }}"
      
  # Clé SSH pour l'accès aux nœuds
  ssh:
    private_key: "{{ vault_ssh_private_key_prod }}"
    public_key: "{{ vault_ssh_public_key_prod }}"
    
    # Clé pour Ansible
    ansible:
      private_key: "{{ vault_ssh_ansible_private_key_prod }}"
      public_key: "{{ vault_ssh_ansible_public_key_prod }}"

# ============================================
# Variables de chiffrement (Production)
# ============================================
encryption:
  # Clé pour le chiffrement des secrets
  key: "{{ vault_encryption_key_prod }}"
  
  # Sel pour le hachage
  salt: "{{ vault_encryption_salt_prod }}"
  
  # Configuration AWS KMS
  kms:
    enabled: true
    key_id: "{{ vault_kms_key_id_prod }}"

# ============================================
# Secrets pour les sauvegardes (Production)
# ============================================
backup:
  # Clé de chiffrement des sauvegardes
  encryption_key: "{{ vault_backup_encryption_key_prod }}"
  
  # Configuration du stockage
  storage:
    s3:
      access_key: "{{ vault_backup_s3_access_key_prod }}"
      secret_key: "{{ vault_backup_s3_secret_key_prod }}"
      bucket: "nova-hello-prod-backups"
      region: "eu-west-1"

# ============================================
# Secrets pour la sécurité (Production)
# ============================================
security:
  # Clé pour le chiffrement des données sensibles
  data_encryption_key: "{{ vault_data_encryption_key_prod }}"
  
  # Clé pour la signature JWT
  jwt:
    private_key: "{{ vault_jwt_private_key_prod }}"
    public_key: "{{ vault_jwt_public_key_prod }}"
  
  # Clé pour la validation des tokens API
  api_gateway:
    secret: "{{ vault_api_gateway_secret_prod }}"

# ============================================
# Notes importantes
# ============================================
# ⚠️ CE FICHIER CONTIENT DES SECRETS DE PRODUCTION SENSIBLES ⚠️
#
# Ce fichier doit être:
# 1. ❌❌❌ JAMAIS commité dans Git (même chiffré) ❌❌❌
#    - Il est dans .gitignore par défaut
#    - Vérifiez que .gitignore contient bien: **/vault.yml
#
# 2. ✅ TOUJOURS chiffré avec Ansible Vault
#    - Pour chiffrer: ansible-vault encrypt ansible/inventories/group_vars/prod/vault.yml
#    - Pour éditer: ansible-vault edit ansible/inventories/group_vars/prod/vault.yml
#
# 3. 🔒 Accès restreint
#    - Seules les personnes autorisées doivent y avoir accès
#    - Utilisez des permissions restreintes: chmod 600 vault.yml
#
# 4. 🔄 Roté régulièrement
#    - Utilisez le script: scripts/rotate-token.sh
#    - Planifiez une rotation trimestrielle minimum
#    - Après rotation, sauvegardez l'ancien fichier avec la date
#
# 5. 🗑️ Destruction sécurisée
#    - Lorsque plus nécessaire, supprimez le fichier de manière sécurisée
#    - Utilisez: shred -u -z -n 10 vault.yml
#
# Pour utiliser ce fichier dans un playbook:
#   vars_files:
#     - inventories/group_vars/prod/vault.yml
#
# ⚠️ ATTENTION: Les variables comme {{ vault_* }} sont des placeholders.
#    Remplacez-les par des VRAIES valeurs lors du chiffrement.
