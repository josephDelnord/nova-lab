---
# TP1: Variables spécifiques à l'environnement prod
# Héritent des variables communes dans all/main.yml

# ============================================
# Configuration de l'environnement
# ============================================
environment: prod
k8s_context: prod

# ============================================
# Configuration de l'application
# ============================================
app:
  name: nova-hello
  version: "1.0.0"
  replica_count: 3
  image: nginx:1.25
  image_pull_policy: IfNotPresent
  
  # Ports
  container_port: 80
  service_port: 80
  target_port: 80
  
  # Configuration du déploiement
  strategy:
    type: RollingUpdate
    rolling_update:
      max_surge: 25%
      max_unavailable: 25%
  
  # Ressources (plus élevées en prod)
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  # Liveness et Readiness probes
  liveness_probe:
    enabled: true
    path: /
    port: 80
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    failure_threshold: 3
    success_threshold: 1
  
  readiness_probe:
    enabled: true
    path: /
    port: 80
    initial_delay_seconds: 5
    period_seconds: 5
    timeout_seconds: 2
    failure_threshold: 1
    success_threshold: 1
  
  # Auto-scaling
  autoscaling:
    enabled: true
    min_replicas: 3
    max_replicas: 10
    target_cpu_utilization: 80
    target_memory_utilization: 80

# ============================================
# Configuration Ingress
# ============================================
ingress:
  enabled: true
  class_name: "nginx"
  
  hosts:
    - host: prod.novalab.local
      paths:
        - path: /
          path_type: Prefix
          service_name: {{ app.name }}
          service_port: {{ app.service_port }}
    
    # Domaine alternatif
    - host: nova-hello.example.com
      paths:
        - path: /
          path_type: Prefix
          service_name: {{ app.name }}
          service_port: {{ app.service_port }}
  
  # TLS activé en production
  tls:
    enabled: true
    secret_name: prod-tls
    hosts:
      - prod.novalab.local
      - nova-hello.example.com
    
    # Configuration Let's Encrypt (si utilisé)
    letsencrypt:
      enabled: false
      email: admin@example.com

# ============================================
# Configuration Service
# ============================================
service:
  type: ClusterIP
  port: 80
  target_port: 80

# ============================================
# Configuration NetworkPolicy
# ============================================
network_policy:
  enabled: true
  
  # Politique stricte en production
  ingress:
    - from:
        - pod_selector:
            match_labels:
              app: nova-hello
        - namespace_selector:
            match_labels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ app.container_port }}
  
  # Egress également restreint
  egress:
    - to:
        - ip_block:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443  # HTTPS uniquement
        - protocol: TCP
          port: 53   # DNS
        - protocol: UDP
          port: 53   # DNS

# ============================================
# Configuration Docker
# ============================================
docker:
  registry: docker.io
  repository: library/nginx
  tag: "1.25"
  
  # Configuration pour les images privées
  private_registry:
    enabled: false
    # url: registry.example.com
    # username: "{{ vault_docker_username }}"
    # password: "{{ vault_docker_password }}"

# ============================================
# Configuration Kubernetes
# ============================================
kubernetes:
  namespace: nova-hello-prod
  
  # Labels supplémentaires
  labels:
    environment: prod
    tier: backend
    managed_by: terraform
    version: "{{ app.version }}"
  
  # Annotations
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"

# ============================================
# Configuration du logging
# ============================================
logging:
  level: info
  
  # Rotation des logs plus fréquente en prod
  logrotate:
    max_size: "50m"
    max_files: 10

# ============================================
# Configuration de sécurité
# ============================================
security:
  # Niveau de sécurité élevé
  level: high
  
  # Ne PAS autoriser le shell root dans les pods
  allow_root: false
  
  # Configuration Pod Security (strict en prod)
  pod_security:
    run_as_non_root: true
    read_only_root_filesystem: true
    privileged: false
    allow_privilege_escalation: false
    capabilities:
      drop:
        - ALL

# ============================================
# Configuration de monitoring
# ============================================
monitoring:
  enabled: true
  
  prometheus:
    enabled: true
    version: v2.47.0
    scrape_interval: 15s
    evaluation_interval: 15s
    
    alertmanager:
      enabled: true
      version: v0.25.0
      
    node_exporter:
      enabled: true
      version: v1.6.0
      
    kube_state_metrics:
      enabled: true
      version: v2.10.0
      
  grafana:
    enabled: true
    version: v10.2.0
    
    # Configuration de l'authentification
    auth:
      enabled: true
      type: basic
      
    dashboards:
      - name: kubernetes
        url: https://grafana.com/api/dashboards/16097/revisions/26/download
      - name: prometheus
        url: https://grafana.com/api/dashboards/1860/revisions/28/download
      - name: node-exporter
        url: https://grafana.com/api/dashboards/11074/revisions/19/download

# ============================================
# Configuration des sauvegardes
# ============================================
backup:
  enabled: true
  
  # Sauvegarde de l'état Terraform
  terraform_state:
    enabled: true
    destination: s3
    bucket: terraform-state-backup
    prefix: nova-hello/prod
  
  # Sauvegarde des bases de données
  database:
    enabled: true
    schedule: "0 2 * * *"  # Tous les jours à 2h
    retention: 7  # 7 jours de rétention

# ============================================
# Variables spécifiques aux nœuds
# ============================================
nodes:
  prod:
    ip: 192.168.56.30
    hostname: prod.novalab.local
    role: worker
    
  # Liste de tous les nœuds prod
  all:
    - 192.168.56.30

# ============================================
# Configuration Ansible
# ============================================
ansible:
  # Variables spécifiques à Ansible
  become: true
  become_method: sudo
  become_user: root
  
  # Gestion des erreurs (strict en prod)
  any_errors_fatal: true
