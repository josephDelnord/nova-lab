---
# TP1: Inventaire Ansible pour nova-lab
# Groupes: ctrl, preprod, prod, nodes, all

all:
  children:
    ctrl:
      hosts:
        ctrl.novalab.local:
          ansible_host: 192.168.56.10
          ansible_port: 2222
          ansible_connection: ssh
          
    nodes:
      children:
        preprod:
          hosts:
            preprod.novalab.local:
              ansible_host: 192.168.56.20
              ansible_port: 2223
              ansible_connection: ssh
              
        prod:
          hosts:
            prod.novalab.local:
              ansible_host: 192.168.56.30
              ansible_port: 2224
              ansible_connection: ssh

# Variables globales pour tous les hôtes
all:
  vars:
    # Utilisateur et clé SSH
    ansible_user: vagrant
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3
    
    # Variables communes
    project_name: nova-lab
    environment: development
    
    # Configuration réseau
    network_cidr: 192.168.56.0/24
    
    # Configuration Docker
    docker_enabled: true
    
    # Configuration Kubernetes
    k3s_enabled: true
    k3s_version: v1.28.5+k3s1
    
    # Configuration Helm
    helm_enabled: true

# Variables spécifiques au groupe ctrl
ctrl:
  vars:
    role: control-plane
    is_controller: true
    
    # Configuration Ansible
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_user: root

# Variables spécifiques au groupe nodes
nodes:
  vars:
    role: worker
    is_controller: false

# Variables spécifiques à preprod
preprod:
  vars:
    environment: preprod
    k8s_context: preprod
    
    # Configuration de l'application
    app_replica_count: 2
    app_image: nginx:1.25
    app_port: 8080
    
    # Couleurs pour l'affichage
    color: "\033[33m"  # Jaune

# Variables spécifiques à prod
prod:
  vars:
    environment: prod
    k8s_context: prod
    
    # Configuration de l'application
    app_replica_count: 3
    app_image: nginx:1.25
    app_port: 80
    
    # Couleurs pour l'affichage
    color: "\033[31m"  # Rouge

# ============================================
# Configuration pour les connexions locales
# ============================================
localhost:
  ansible_connection: local
  ansible_python_interpreter: /usr/bin/python3
  
  # Utilisé pour les tests locaux
  test_mode: true
